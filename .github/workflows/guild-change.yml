name: Validate guild submissions
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: guild-mutations
  cancel-in-progress: false
jobs:
  process:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[raid-change] ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate and apply submissions
        id: process
        run: npx tsx scripts/process-issues.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish updated snapshot
        if: always() && steps.process.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
