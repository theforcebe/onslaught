name = "onslaught-gateway"
main = "server/worker.ts"
compatibility_date = "2026-11-10"
workers_dev = true

[observability]
enabled = false

[vars]
APP_ORIGIN = "https://theforcebe.github.io"
PUBLIC_API_URL = "https://onslaught-gateway.onslaught-raid.workers.dev"
GITHUB_REPOSITORY = "theforcebe/onslaught-data"

[[d1_databases]]
binding = "DB"
database_name = "onslaught-auth"
database_id = "75758bc6-2e0c-446a-b22a-cc2dbe095939"

# Store BNET_CLIENT_ID, BNET_CLIENT_SECRET, GITHUB_TOKEN, IDENTITY_KEY,
# and ADMIN_BNET_IDS with `wrangler secret put`.
# Never put their values in this file or in VITE_ environment variables.
